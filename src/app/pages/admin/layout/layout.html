<div class="admin-shell">

  <aside
    class="admin-sidebar"
    [class.sidebar-open]="menuOpen"
  >
    <div class="sidebar-brand">
      <div class="brand-symbol">ॐ</div>

      <div>
        <h1>Meenakshi</h1>
        <p>Santhana Kadai</p>
        <span>Admin Panel</span>
      </div>
    </div>

    <nav class="admin-navigation">

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        <span class="nav-icon">⌂</span>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/admin/products"
        routerLinkActive="active-link"
        (click)="closeMenu()"
      >
        <span class="nav-icon">◇</span>
        <span>Products</span>
      </a>
<a
  routerLink="/admin/categories"
  routerLinkActive="active"
>
  <span>◇</span>
  Categories
</a>
      <a
        routerLink="/admin/user-details"
        routerLinkActive="active-link"
        (click)="closeMenu()"
      >
        <span class="nav-icon">♙</span>
        <span>User Details</span>
      </a>

    </nav>

    <div class="sidebar-footer">
      <a
        routerLink="/"
        class="website-link"
        (click)="closeMenu()"
      >
        <span class="nav-icon">↗</span>
        <span>View Website</span>
      </a>

      <button
        type="button"
        class="logout-button"
        (click)="logout()"
      >
        <span class="nav-icon">⇥</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <button
    type="button"
    class="sidebar-overlay"
    [class.overlay-visible]="menuOpen"
    aria-label="Close admin menu"
    (click)="closeMenu()"
  ></button>

  <section class="admin-content">

    <header class="mobile-admin-header">
      <div>
        <strong>Meenakshi</strong>
        <span>Admin Panel</span>
      </div>

      <button
        type="button"
        class="menu-button"
        aria-label="Open admin menu"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <main class="admin-router-content">
      <router-outlet></router-outlet>
    </main>

  </section>

</div>
